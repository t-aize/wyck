name: Bug report
description: Something does not work as expected
labels: [ bug ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please search existing issues first, and never paste
        secrets, tokens, or account identifiers. Security problems go through the private
        form described in the security policy, not here.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps or input that shows the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0 or a commit hash"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true

  - type: input
    id: toolchain
    attributes:
      label: Rust toolchain
      description: Output of `rustc --version`, if you built from source.

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste as text. It is rendered as code automatically.
      render: shell

  - type: dropdown
    id: ai
    attributes:
      label: AI assistance
      description: AI tools are allowed but must be disclosed, so the report gets an extra check.
      options:
        - No AI tools were used
        - AI helped write this report
        - AI helped find the problem
        - Both
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the open and closed issues and found no duplicate.
          required: true
        - label: I removed all secrets and private data from this report.
          required: true
        - label: I confirmed what is described here myself.
          required: true
