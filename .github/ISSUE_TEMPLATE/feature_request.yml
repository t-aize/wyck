name: Feature request
description: Suggest a change or an addition
labels: [ enhancement ]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Pull requests are not accepted yet, so an issue
        is the way to propose a change.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: The use case comes first, the solution second.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you would like to see. Rough ideas are fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, or workarounds you use today.

  - type: dropdown
    id: ai
    attributes:
      label: AI assistance
      description: AI tools are allowed but must be disclosed, so the request gets an extra check.
      options:
        - No AI tools were used
        - AI helped write this request
        - AI helped come up with the idea
        - Both
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the open and closed issues and found no duplicate.
          required: true
        - label: I read the contributing guide.
          required: true
