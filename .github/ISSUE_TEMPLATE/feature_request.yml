name: Feature request
description: Suggest an improvement or a new feature
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please search [existing issues](https://github.com/t-aize/wyck/issues?q=is%3Aissue) first.

        **Never paste API keys, tokens, passwords, or account numbers.**

  - type: dropdown
    id: area
    attributes:
      label: Which part is this about?
      options:
        - Website (pages, layout, content)
        - Download
        - Connecting to the app
        - Wyck app
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the need, not the solution. What are you doing, and what gets in the way?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Describe the behavior you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other ways to solve it, or workarounds you use today.

  - type: markdown
    attributes:
      value: |
        ## AI assistance

        Using AI is fine, but I need to know about it. AI output can be confident and wrong, so whatever it told you must be checked by you before you report it.

  - type: dropdown
    id: ai_usage
    attributes:
      label: Was AI involved in this request?
      options:
        - No, I wrote and thought this through myself
        - AI helped me write or translate the text
        - AI helped me come up with or research the idea
        - AI wrote most of this request
    validations:
      required: true

  - type: input
    id: ai_tool
    attributes:
      label: AI tool and model
      description: Which tool and model, if any. Leave empty if no AI was involved.
      placeholder: "e.g. Claude Sonnet 5.5, ChatGPT, GitHub Copilot"

  - type: textarea
    id: ai_verification
    attributes:
      label: How did you verify it?
      description: Required if AI was involved. How did you check that the problem is real and the idea makes sense? Leave empty if no AI was involved.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I checked that everything in this request is accurate and that nothing like it already exists.
          required: true
        - label: I removed all secrets, tokens, and personal or account data from this request.
          required: true
