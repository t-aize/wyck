name: Set up Rust
description: >-
  Installs the toolchain named in rust-toolchain.toml, the system libraries the app links against
  (Linux only) and the cargo cache. Run actions/checkout first.

inputs:
  system-libraries:
    description: Whether to install the libraries the app links against on Linux.
    required: false
    default: "true"
  cache:
    description: >-
      Whether to restore the cargo cache. A release must not: a cache could carry something
      other than what the source builds into a signed package.
    required: false
    default: "true"
  save-cache:
    description: Whether this job writes the cargo cache. Only runs on main should.
    required: false
    default: "false"
  cache-key:
    description: Added to the cache key, to keep two jobs of the same name apart.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install the system libraries (Linux)
      if: runner.os == 'Linux' && inputs.system-libraries == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config libfontconfig-dev libwayland-dev libssl-dev \
          libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libasound2-dev

    # With no argument, rustup installs what rust-toolchain.toml asks for (channel, profile and
    # components), so that file stays the one place that names the toolchain.
    - name: Install the Rust toolchain
      shell: bash
      run: rustup toolchain install

    # Pull requests and branches restore the cache read-only; main writes it. That keeps the
    # 10 GB cache quota of the repository from filling up with one entry per branch.
    - name: Restore the cargo cache
      if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.save-cache }}
