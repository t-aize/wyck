version: 2

updates:
  # Dépendances du projet (bun.lock) — écosystème "bun" natif depuis Dependabot juin 2025.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    # Laisse le temps à la communauté de repérer un paquet compromis avant qu'on l'installe
    # (n'affecte pas les mises à jour de sécurité, qui l'ignorent toujours). Les major méritent
    # plus de recul : elles restent aussi non groupées (cf. commentaire plus bas).
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      # effect/opentui : toujours groupés, y compris en major (packages liés entre eux, un décalage
      # de version entre @effect/platform et effect casse le build).
      effect:
        patterns:
          - "effect"
          - "@effect/*"
      opentui:
        patterns:
          - "@opentui/*"
      # Tout le reste (zod, mcp-sdk, biome, husky, lint-staged, typescript, @types/*...) : les minor/
      # patch sont groupés en une seule PR hebdo pour limiter le bruit. Les major restent individuelles
      # (potentiellement breaking, méritent une review à part).
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Actions utilisées dans .github/workflows/*.yml et .github/actions/*/action.yml. Toutes
  # épinglées à un SHA de commit (cf. ci.yml) : Dependabot met à jour le SHA et le commentaire
  # de version ensemble, la lisibilité ne change pas.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"
    # Les actions tournent avec les privilèges du run CI (accès repo, parfois secrets) : cooldown
    # plus long que les dépendances applicatives, cf. incidents de supply chain sur des actions
    # tierces compromises peu après publication d'un tag.
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
