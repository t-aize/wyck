version: 2

updates:
  # Keeps the SHA-pinned actions in .github/workflows up to date.
  # Application dependencies are upgraded manually with `bun run deps:update`.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # wait a week after a release before proposing it
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
