name: Audit

# Checks the dependency graph against the RustSec advisory database and the rules in
# deny.toml (licenses, banned or duplicate crates, allowed registries). It also runs on a
# schedule, because a new advisory can appear for a dependency that has not changed.

on:
  push:
    branches: [ main ]
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - .github/workflows/audit.yml
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
