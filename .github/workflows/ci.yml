name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bun run verify

      # Pas de bundle "léger" possible ici : @opentui/core résout ses binaires natifs par plateforme
      # via des import() dynamiques que seul --compile élague au moment de la cible (un bundle
      # generic tente de tout résoudre statiquement et échoue sur les plateformes non installées).
      - name: Verify the build compiles
        run: bun build ./src/index.tsx --compile --outfile /tmp/build-check
