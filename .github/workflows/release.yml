name: Release

# A tag `vX.Y.Z` builds, signs and publishes the installers. The tag must be the version of the
# workspace, sit on `main`, and its commit must have passed `ci-ok`.
#
# Run by hand ("Run workflow"), it is a dry run: it builds and packages from the branch it is
# started on with a throw-away signing key, and publishes nothing. It is how a change to this
# file or to the packaging settings is tested without cutting a tag.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  CARGO_PACKAGER_VERSION: 0.11.8

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate the release
    runs-on: ubuntu-latest
    # The checks of the commit may still be running when the tag is pushed: wait for them.
    timeout-minutes: 50
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The release is built without a cache, see the "package" job.
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          system-libraries: "false"
          cache: "false"

      - name: Read the version of the workspace
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '[.packages[].version] | unique | if length == 1 then .[0] else error("the crates do not all have the same version") end')
          if [ "$EVENT" = "push" ]; then
            if [[ ! "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Release tags must use stable SemVer: vX.Y.Z" >&2
              exit 1
            fi
            if [ "${REF_NAME#v}" != "$version" ]; then
              echo "Tag $REF_NAME does not match the version of the workspace ($version)." >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check that the tagged commit is on main
        if: github.event_name == 'push'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Wait for the checks of the tagged commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=ci-ok" \
              --jq '[.check_runs[].conclusion // "pending"] | last // "none"')
            echo "ci-ok on $GITHUB_SHA: $conclusion (attempt $attempt)"
            case "$conclusion" in
              success) exit 0 ;;
              pending | none) sleep 30 ;;
              *) echo "ci-ok did not succeed on the tagged commit." >&2; exit 1 ;;
            esac
          done
          echo "ci-ok did not finish in time." >&2
          exit 1

  package:
    name: Package (${{ matrix.platform }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis
          # Built on the Apple silicon runner, which is much faster than the Intel one.
          - platform: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            formats: app,dmg
          - platform: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            formats: app,dmg
          - platform: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            formats: appimage,deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    # The signing key lives in the `release` environment, which only a version tag can use. A dry
    # run gets an environment with no secret.
    environment: ${{ github.event_name == 'push' && 'release' || 'release-dry-run' }}
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the updater signing secrets
        if: github.event_name == 'push'
        env:
          PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_KEY" || { echo "CARGO_PACKAGER_SIGN_PRIVATE_KEY is missing" >&2; exit 1; }
          test -n "$PRIVATE_KEY_PASSWORD" || { echo "CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD is missing" >&2; exit 1; }

      # No cache for a release: something other than what the source builds into the package
      # could otherwise end up in a signed installer.
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"

      - name: Add the target to the toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      - name: Install cargo-packager
        run: cargo install cargo-packager --version "$CARGO_PACKAGER_VERSION" --locked

      - name: Build the release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p wyck --target "$TARGET"

      - name: Package and sign
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          FORMATS: ${{ matrix.formats }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ github.event_name == 'push' && secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY || format('{0}/dry-run.key', runner.temp) }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD || 'dry-run' }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "push" ]; then
            cargo packager signer generate --ci --password dry-run --path "$RUNNER_TEMP/dry-run.key"
          fi
          cargo packager --release --packages wyck \
            --target "$TARGET" \
            --formats "$FORMATS" \
            --out-dir "dist/$PLATFORM"

      - name: Check the signatures and name the release files
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cargo run --locked --quiet --package xtask -- release name-assets \
            --input "dist/$PLATFORM" \
            --platform "$PLATFORM" \
            --release-version "$VERSION"

      - name: Keep the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/Wyck_${{ needs.validate.outputs.version }}_*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish
    if: github.event_name == 'push'
    needs: [ validate, package ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f target_commitish="$GITHUB_SHA" \
            --jq .body > release-assets/RELEASE_NOTES.md

      # No cache, as in the packaging jobs: this step decides what the updater downloads.
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          system-libraries: "false"
          cache: "false"

      - name: Write the update manifest and the checksums
        run: |
          cargo run --locked --quiet --package xtask -- release manifest \
            --assets release-assets \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --notes release-assets/RELEASE_NOTES.md

      - name: Attest the release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*

      # A draft first, so that nothing is public until every file is in. A published release can
      # then be made immutable (a repository setting).
      - name: Create the draft, upload everything, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "Wyck $VERSION" \
            --notes-file release-assets/RELEASE_NOTES.md
          gh release upload "$GITHUB_REF_NAME" release-assets/*
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      - name: Verify the attestation of every installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in release-assets/Wyck_*; do
            case "$file" in *.sig) continue ;; esac
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY"
          done
