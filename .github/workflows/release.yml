name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches package.json version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          $pkgVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($tagVersion -ne $pkgVersion) {
            Write-Error "Tag ${{ github.ref_name }} does not match package.json version ($pkgVersion)"
            exit 1
          }

      - uses: oven-sh/setup-bun@v2

      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Rename binary and generate checksum
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $name = "aurum-$version-windows-x64.exe"
          Rename-Item dist/aurum.exe $name
          (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower() + "  $name" |
            Out-File -Encoding ascii "dist/$name.sha256"

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/aurum-*.exe
            dist/aurum-*.sha256
          generate_release_notes: true
          draft: false
