name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - id: version
        name: Validate tag and package version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use stable SemVer: vX.Y.Z" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [[ "$package_version" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match the package version $package_version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - platform: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - platform: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release-${{ matrix.target }}
          save-if: false

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Archive
        shell: bash
        env:
          NAME: wyck_${{ needs.validate.outputs.version }}_${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p "dist/$NAME"
          cp LICENSE README.md "dist/$NAME/"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp "target/$TARGET/release/wyck.exe" "dist/$NAME/"
            (cd dist && 7z a -tzip "$NAME.zip" "$NAME")
          else
            cp "target/$TARGET/release/wyck" "dist/$NAME/"
            tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [validate, package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums and release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum wyck_* > SHA256SUMS)
          gh api --method POST \
            repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="${GITHUB_REF_NAME}" \
            -f target_commitish="${GITHUB_SHA}" \
            --jq .body > RELEASE_NOTES.md

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*

      - name: Create draft, upload everything, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "wyck $VERSION" \
            --notes-file RELEASE_NOTES.md
          gh release upload "$GITHUB_REF_NAME" release-assets/*
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
