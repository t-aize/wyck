# Formatting of the TOML files: https://taplo.tamasfe.dev/configuration/formatter-options.html
# Run `taplo fmt` to apply it, `taplo fmt --check` to only look (CI does).
include = ["**/*.toml"]
# The fixtures are saved files of old versions of the app, kept exactly as they were written.
exclude = ["target/**", "**/fixtures/**"]

[formatting]
column_width = 100
# The indentation of .editorconfig.
indent_string = "  "
