[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["t-aize"]
publish = false

[workspace.dependencies]
# Async runtime (cTrader MCP client, market data streaming)
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
] }

# cTrader MCP client (streamable HTTP + SSE, matches mcp.ctrader.com)
#
# `reqwest-native-tls` is NOT optional here: rmcp declares its `reqwest` dependency
# with `default-features = false` (only pulling `json`/`stream`), so without
# explicitly requesting a TLS backend feature, reqwest compiles with NONE at all --
# it builds a working `Client` (no error at construction time), but every request
# to an `https://` URL then fails at send-time with a generic "error sending
# request" (no TLS connector available to actually perform the handshake). Verified
# against mcp.ctrader.com specifically: `native-tls` (OS-native -- SChannel on
# Windows, Secure Transport on macOS, OpenSSL on Linux) connects and completes the
# handshake there (matches what `curl` does through SChannel); the alternative
# `reqwest` feature (rustls) was not verified against this endpoint. Do not swap to
# `reqwest`/rustls without re-verifying a real connection first.
rmcp = { version = "3.4.0", features = [
  "client",
  "transport-streamable-http-client-reqwest",
  "reqwest-native-tls",
  "client-side-sse",
] }

# Headless trading core: sessions, state, sizing, order pipeline, guardrails, news
wyck-engine = { path = "crates/wyck-engine" }

# Cancellation tokens for cooperative shutdown of background tasks
tokio-util = { version = "0.7.19", features = ["rt"] }

# Test-only: property-based testing (unit conversions, sizing invariants)
proptest = "1.11.0"

# Typed Rust client for cTrader's Local and Remote MCP servers (in-workspace crate)
ctrader-mcp = { path = "crates/ctrader-mcp" }

# Centralized app config + encrypted credential storage (in-workspace crate)
wyck-config = { path = "crates/wyck-config" }

# Economic calendar (ForexFactory feed): fetch, parse, filter, refresh service, and
# high-impact-event warnings (in-workspace crate)
wyck-calendar = { path = "crates/wyck-calendar" }

# Plain HTTPS client for unauthenticated JSON feeds (wyck-calendar). Same TLS backend
# as rmcp's transport above (OS-native), for the same reason: with
# `default-features = false` reqwest compiles with NO TLS connector unless one is
# requested explicitly.
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }

# Object-safe async traits (the broker port is used behind `dyn`)
async-trait = "0.1.92"

# Base64url decoding (reading the informational environment claim of an access token)
base64 = "0.23.1"

# Serialization (MCP JSON-RPC payloads/schemas)
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Logging facade (libraries emit events; the application chooses the subscriber)
tracing = "0.1.44"

# Application-side logging (wyck-app): subscriber with an env filter, and a rolling file
# appender. Libraries only use the `tracing` facade above.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "std", "ansi"] }
tracing-appender = "0.2.5"

# GUI (wyck-app): GPUI with the gpui-component library, through the single `gpui-kit`
# crate that pins and re-exports them. Exact version on purpose: GPUI is pre-1.0 and
# breaks often, and this is a community snapshot of Zed, see docs/gpui-dependency.md
# before touching it. Automated updates must ignore it.
gpui-kit = "=0.6.4"

# System-wide keyboard shortcuts for the GUI (Win32 RegisterHotKey on Windows)
global-hotkey = "0.8.0"

# Unbounded channel from the hotkey handler (runs inside the Windows message loop, must not
# block) to the GPUI task that reacts to it
async-channel = "2.5.0"

# Config/credentials file locations
directories = "6.0.0"

# Structured error types (ctrader-mcp error classification)
thiserror = "2.0.20"

# Idempotency-key generation (ctrader-mcp session bootstrap, W0)
uuid = { version = "1.18.1", features = ["v4"] }

# RFC 3339 timestamp formatting/parsing (ctrader-mcp Local server Z-suffix convention)
time = { version = "0.3.44", features = ["formatting", "parsing", "macros"] }

# --- wyck-config: centralized app config + encrypted credential storage ---

# Human-editable config file format (profiles, preferences)
toml = "1.1.6"

# Secret-in-memory hygiene (zeroize-on-drop, no accidental Debug/log exposure)
secrecy = { version = "0.10.3", features = ["serde"] }

# Primary credential backend: OS-native store (Windows Credential Manager /
# macOS Keychain / Linux Secret Service via zbus). NEVER disable default-features
# on this dependency -- see wyck-config's secret::keyring_store module docs for why
# (pre-v4 releases of this crate silently fell back to a non-persistent in-memory
# mock store when the platform feature wasn't compiled in).
keyring = "4.2.0"

# Fallback credential backend for environments without an OS keyring (headless
# Linux/CI/always-on boxes) -- KDF (passphrase -> encryption key) and AEAD cipher.
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"

# Test-only: isolated temp directories for wyck-config's config/secret-store tests
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
