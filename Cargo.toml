[package]
name = "wyck"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["t-aize"]
repository = "https://github.com/t-aize/wyck"
readme = "README.md"
description = "Terminal trading panel for cTrader."
keywords = ["ctrader", "trading", "forex", "tui", "openapi"]
categories = ["finance", "command-line-utilities"]
publish = false

[dependencies]
anyhow = "1"
argon2 = "0.6.0"
async-trait = "0.1.92"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
keyring = "4.2.0"
open = "5"
ratatui = "0.30"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "test-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.18.1", features = ["v4"] }
zeroize = "1.9.0"

[dev-dependencies]
dotenvy = "0.15.7"
proptest = "1.11.0"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
