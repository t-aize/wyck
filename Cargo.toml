[workspace]
members = ["crates/*"]
default-members = ["crates/wyck"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["t-aize"]
repository = "https://github.com/t-aize/wyck"
publish = false

[workspace.dependencies]
wyck-chart = { path = "crates/wyck-chart" }
wyck-config = { path = "crates/wyck-config" }
wyck-openapi = { path = "crates/wyck-openapi" }
wyck-openapi-model = { path = "crates/wyck-openapi-model" }
wyck-state = { path = "crates/wyck-state" }
wyck-trading = { path = "crates/wyck-trading" }
ab_glyph = "0.2.32"
anyhow = "1"
argon2 = "0.6.0"
async-trait = "0.1.92"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
chrono-tz = "0.10.4"
directories = "6.0.0"
dotenvy = "0.15.7"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
gpui = { package = "gpui-pre", version = "0.3.5" }
gpui-kit = "0.6.6"
keyring = "4.2.0"
lsp-types = "0.97"
proptest = "1.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
rhai = { version = "1", features = ["sync", "metadata", "no_module", "no_time"] }
rust-embed = { version = "8", features = ["debug-embed"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.20"
time = "0.3.44"
tiny-skia = "0.12.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "test-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
unicode-segmentation = "1.13.3"
uuid = { version = "1.18.1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"

# gpui paints every quad and glyph through generic code that is very slow unoptimized. Building
# the dependencies with optimizations keeps `cargo run` smooth; our own crate stays debuggable.
[profile.dev.package."*"]
opt-level = 3
