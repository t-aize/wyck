[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["t-aize"]
publish = false

[workspace.dependencies]
# TUI
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
tui-input = "0.15.4"

# Error handling
color-eyre = "0.6.5"

# Async runtime (cTrader MCP client, market data streaming)
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
] }

# cTrader MCP client (streamable HTTP + SSE, matches mcp.ctrader.com)
rmcp = { version = "3.4.0", features = [
  "client",
  "transport-streamable-http-client-reqwest",
  "client-side-sse",
] }

# Serialization (MCP JSON-RPC payloads/schemas)
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Logging (stdout is owned by the terminal, so logs go to file)
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"

# Config/credentials file locations
directories = "6.0.0"

# Structured error types (ctrader-mcp error classification)
thiserror = "2.0.20"

# Idempotency-key generation (ctrader-mcp session bootstrap, W0)
uuid = { version = "1.18.1", features = ["v4"] }

# RFC 3339 timestamp formatting/parsing (ctrader-mcp Local server Z-suffix convention)
time = { version = "0.3.44", features = ["formatting", "parsing", "macros"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
