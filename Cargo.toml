[package]
name = "wyck"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["t-aize"]
publish = false
description = "A terminal trading panel for cTrader: app config/credentials and a cTrader Open API client."
default-run = "wyck"

[dependencies]
async-trait = "0.1.92"

tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "net",
  "io-util",
] }

tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

tracing = "0.1.44"
directories = "6.0.0"
thiserror = "2.0.20"
uuid = { version = "1.18.1", features = ["v4"] }
time = { version = "0.3.44", features = ["formatting", "parsing", "macros"] }

gpui-kit = "0.6.6"
rust-embed = { version = "8", features = ["debug-embed"] }
gpui = { package = "gpui-pre", version = "0.3.5" }
unicode-segmentation = "1.13.3"

toml = "1.1.6"
secrecy = { version = "0.10.3", features = ["serde"] }
keyring = "4.2.0"
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"

dotenvy = "0.15.7"
clap = { version = "4.6.7", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
proptest = "1.11.0"
tokio = { version = "1.53.1", features = ["rt", "macros", "test-util", "net", "io-util", "signal"] }

[[bin]]
name = "sign-in"
path = "scripts/sign_in.rs"

[[bin]]
name = "refresh-tokens"
path = "scripts/refresh_tokens.rs"

[[bin]]
name = "check-connection"
path = "scripts/check_connection.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"

# gpui paints every quad and glyph through generic code that is very slow unoptimized. Building
# the dependencies with optimizations keeps `cargo run` smooth; our own crate stays debuggable.
[profile.dev.package."*"]
opt-level = 3
