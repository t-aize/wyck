# Wyck, a desktop trading terminal for cTrader.
#
# A virtual workspace: no code lives at the root, every crate is a folder of `crates/`. This file
# is the one place that says which version of a dependency is used, which lints apply and how
# the crates are compiled. A crate never writes a version, a path or a lint level of its own:
# it opts in with `dep.workspace = true` and `[lints] workspace = true`.

[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# `cargo run` and `cargo build` at the root mean the app; `xtask` is reached with `cargo xtask`.
default-members = ["crates/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"
# Keep in sync with `rust-toolchain.toml`. With resolver 3 this also steers dependency resolution.
rust-version = "1.99"
license = "Apache-2.0"
authors = ["t-aize"]
repository = "https://github.com/t-aize/wyck"
homepage = "https://github.com/t-aize/wyck"
readme = "README.md"
publish = false

# The crates of this workspace. A crate lists the ones it uses here too (`wyck-core.workspace = true`);
# which ones it may use is decided by `LAYERS` in `xtask/src/deps.rs`.
[workspace.dependencies]
wyck-app = { path = "crates/wyck-app" }
wyck-chart = { path = "crates/wyck-chart" }
wyck-clock = { path = "crates/wyck-clock" }
wyck-core = { path = "crates/wyck-core" }
wyck-ctrader = { path = "crates/wyck-ctrader" }
wyck-drawings = { path = "crates/wyck-drawings" }
wyck-indicators = { path = "crates/wyck-indicators" }
wyck-market = { path = "crates/wyck-market" }
wyck-platform = { path = "crates/wyck-platform" }
wyck-storage = { path = "crates/wyck-storage" }
wyck-trading = { path = "crates/wyck-trading" }
wyck-ui-chart = { path = "crates/wyck-ui-chart" }
wyck-ui-editor = { path = "crates/wyck-ui-editor" }
wyck-ui-kit = { path = "crates/wyck-ui-kit" }
wyck-ui-shell = { path = "crates/wyck-ui-shell" }
wyck-ui-trading = { path = "crates/wyck-ui-trading" }

# Every external dependency, with its version. The features a crate needs are listed by that
# crate (`tokio = { workspace = true, features = ["time"] }`), so that each one asks only for
# what it uses. `default-features = false` is here where the defaults were already refused.
ab_glyph = "0.2.32"
anyhow = "1"
argon2 = "0.6.0"
async-trait = "0.1.92"
cargo-packager-updater = "0.2.3"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", default-features = false }
directories = "6.0.0"
dotenvy = "0.15.7"
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.4.3"
gpui = { package = "gpui-pre", version = "0.3.8" }
gpui-kit = "0.7.1"
keyring = "4.2.0"
lsp-types = "0.97"
notify-rust = "4.18"
percent-encoding = "2.3.2"
proptest = "1.12.0"
reqwest = { version = "0.13.5", default-features = false }
rhai = "1"
rodio = { version = "0.22", default-features = false }
rust-embed = "8"
secrecy = "0.10.3"
semver = "1.0.28"
serde = "1.0.229"
serde_json = "1.0.152"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tiny-skia = "0.12.0"
tokio = "1.53.2"
tokio-tungstenite = "0.30.0"
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
unicode-segmentation = "1.13.3"
uuid = "1.28.0"
winresource = "0.1"
zeroize = "1.9.1"

# ---------------------------------------------------------------------------------------------
# Lints
#
# The rules every crate follows: each one opts in with `[lints] workspace = true` (`cargo xtask
# deps` checks it) and must pass without a warning.
#
# CI runs `cargo clippy --workspace --all-targets --all-features --locked -- -D warnings`, so a
# `warn` here blocks a merge just like a `deny`; the difference is only how loud it is locally.
#
# A crate that opts in cannot add lint levels of its own in its manifest. A crate-wide exception
# is written in source instead: `#![expect(clippy::print_stdout, reason = "...")]`.
# ---------------------------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code = "forbid"
# A `pub` item no other crate can reach should be `pub(crate)`: then `dead_code` can see it.
unreachable_pub = "warn"
# A dropped `Result` or future is how an order error gets lost.
unused_must_use = "deny"
unused_lifetimes = "warn"
unused_qualifications = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unused_import_braces = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
bare_urls = "warn"
invalid_html_tags = "warn"

[workspace.lints.clippy]
# Base: all of `pedantic` as warnings. Every lint below is applied on top of it, which is why
# the group has a lower priority. The `cargo` group is left out on purpose: `cargo-deny` (see
# `deny.toml`) already checks duplicate versions, licenses and sources.
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that cost more than they bring in this code base.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
too_many_lines = "allow"
similar_names = "allow"

# No panics and no lost results. `clippy.toml` lets tests keep `unwrap`, `expect` and `panic`.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
mem_forget = "deny"
unreachable = "warn"
panic_in_result_fn = "warn"

# Data coming from the network is never trusted: no unchecked indexing or slicing.
indexing_slicing = "warn"
string_slice = "warn"

# The app reports through `tracing`; printing is for examples and tools, which opt out.
print_stdout = "warn"
print_stderr = "warn"
exit = "warn"
# Every exception says why, and `expect` fails once the lint it silenced goes away.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Make shared ownership and field additions explicit.
clone_on_ref_ptr = "warn"
rest_pat_in_fully_bound_structs = "warn"

# Redundancy and waste.
match_same_arms = "warn"
redundant_clone = "warn"
needless_collect = "warn"
branches_sharing_code = "warn"
collection_is_never_read = "warn"
use_self = "warn"
trait_duplication_in_bounds = "warn"
needless_pass_by_value = "warn"
unused_self = "warn"
unnecessary_wraps = "warn"
assigning_clones = "warn"
unused_async = "warn"

# Likely mistakes.
suspicious_operation_groupings = "warn"
case_sensitive_file_extension_comparisons = "warn"
used_underscore_binding = "warn"
derive_partial_eq_without_eq = "warn"
significant_drop_in_scrutinee = "warn"

# Numbers. Stricter money rules (no float arithmetic, no unchecked integer arithmetic) are not
# enabled here because chart code needs both; see the audit notes in the migration prompt.
lossy_float_literal = "warn"
float_cmp_const = "warn"

# ---------------------------------------------------------------------------------------------
# Profiles
# ---------------------------------------------------------------------------------------------
[profile.release]
lto = "fat"
codegen-units = 1
# Keep function names so a crash log has a readable backtrace; drop the bulky debug info.
strip = "debuginfo"
panic = "unwind"
# Integer overflow wraps silently in release by default. For prices, volumes and PnL it must not.
overflow-checks = true

# Line tables are enough to read a backtrace, and they keep the test binaries (each links the
# whole library) from filling the disk.
[profile.dev]
debug = "line-tables-only"

# gpui paints every quad and glyph through generic code that is very slow unoptimized. Building
# the dependencies with optimizations keeps `cargo run` smooth; our own crates stay debuggable.
[profile.dev.package."*"]
opt-level = 3
debug = false
