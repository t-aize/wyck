# Wyck, a desktop trading terminal for cTrader.
#
# A virtual workspace: no code lives at the root, every crate is a folder of `crates/`. This file
# is the one place that says which version of a dependency is used, which lints apply and how
# the crates are compiled. A crate never writes a version, a path or a lint level of its own:
# it opts in with `dep.workspace = true` and `[lints] workspace = true`.

[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# `cargo run` and `cargo build` at the root mean the app; `xtask` is reached with `cargo xtask`.
default-members = ["crates/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["t-aize"]
repository = "https://github.com/t-aize/wyck"
homepage = "https://github.com/t-aize/wyck"
readme = "README.md"
publish = false

# The crates of this workspace. A crate lists the ones it uses here too (`wyck-core.workspace = true`);
# which ones it may use is decided by `LAYERS` in `xtask/src/deps.rs`.
[workspace.dependencies]
wyck-chart = { path = "crates/wyck-chart" }
wyck-core = { path = "crates/wyck-core" }
wyck-drawings = { path = "crates/wyck-drawings" }
wyck-indicators = { path = "crates/wyck-indicators" }
wyck-market = { path = "crates/wyck-market" }
wyck-trading = { path = "crates/wyck-trading" }

# Every external dependency, with its version. The features a crate needs are listed by that
# crate (`tokio = { workspace = true, features = ["time"] }`), so that each one asks only for
# what it uses. `default-features = false` is here where the defaults were already refused.
ab_glyph = "0.2.32"
anyhow = "1"
argon2 = "0.6.0"
async-trait = "0.1.92"
cargo-packager-updater = "0.2.3"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", default-features = false }
directories = "6.0.0"
dotenvy = "0.15.7"
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.4.3"
gpui = { package = "gpui-pre", version = "0.3.8" }
gpui-kit = "0.7.1"
keyring = "4.2.0"
lsp-types = "0.97"
notify-rust = "4.18"
percent-encoding = "2.3.2"
proptest = "1.12.0"
reqwest = { version = "0.13.5", default-features = false }
rhai = "1"
rodio = { version = "0.22", default-features = false }
rust-embed = "8"
secrecy = "0.10.3"
semver = "1.0.28"
serde = "1.0.229"
serde_json = "1.0.152"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tiny-skia = "0.12.0"
tokio = "1.53.2"
tokio-tungstenite = "0.30.0"
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
unicode-segmentation = "1.13.3"
uuid = "1.28.0"
winresource = "0.1"
zeroize = "1.9.1"

# The rules every crate that opts in with `[lints] workspace = true` follows. `wyck`, the crate
# the others are being taken out of, keeps the short list it had until it is empty (see its
# manifest); each crate that leaves it follows this one in full and must pass without a warning.
[workspace.lints.rust]
unsafe_code = "forbid"
# A `pub` item no other crate can reach should be `pub(crate)`: then `dead_code` can see it.
unreachable_pub = "warn"

[workspace.lints.clippy]
# No `unwrap` or `expect` outside tests (clippy.toml lets tests keep them), and no leftovers.
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# The app reports through `tracing`; printing is for examples and tools, which opt out.
print_stdout = "warn"
print_stderr = "warn"
exit = "warn"
# Every `allow` says why, and `expect` fails when the lint it silenced goes away.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Redundancy and waste.
match_same_arms = "warn"
redundant_clone = "warn"
needless_pass_by_value = "warn"
unused_self = "warn"
unnecessary_wraps = "warn"
assigning_clones = "warn"
unused_async = "warn"
# Likely mistakes.
suspicious_operation_groupings = "warn"
case_sensitive_file_extension_comparisons = "warn"
used_underscore_binding = "warn"
derive_partial_eq_without_eq = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"

# Line tables are enough to read a backtrace, and they keep the test binaries (each links the
# whole library) from filling the disk.
[profile.dev]
debug = "line-tables-only"

# gpui paints every quad and glyph through generic code that is very slow unoptimized. Building
# the dependencies with optimizations keeps `cargo run` smooth; our own crates stay debuggable.
[profile.dev.package."*"]
opt-level = 3
debug = false
