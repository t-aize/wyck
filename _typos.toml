# Spell checking with typos: https://github.com/crate-ci/typos/blob/master/docs/reference.md
# Run `typos` to look, `typos --write-changes` to fix what it is sure about.

[files]
extend-exclude = [
  # The working plan is written in French.
  "docs/PLAN.md",
  # Images, fonts and the logos of other companies are not text.
  "crates/*/assets/**",
  "Cargo.lock",
]

[default.extend-words]
# "PnL", profit and loss, which the cTrader names write as UnrealizedPnL and typos splits in two.
pn = "pn"
# Written wrong on purpose in tests: a script naming a series that does not exist.
clos = "clos"
caf = "caf"
# The ticker of Boeing, and the short name made from "Momentum" (the test expects five letters).
ba = "ba"
momen = "momen"
