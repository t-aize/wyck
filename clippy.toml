# `unwrap_used` and `expect_used` are denied (workspace lints in the root Cargo.toml). Tests may use
# them: a failing `unwrap` is how a test fails, and a test may print what it found. This covers
# `#[test]` functions and `#[cfg(test)]` modules; the helper functions of an integration test
# would need an `#![allow]` instead.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true
