# Clippy configuration, shared by the whole workspace. The lint levels live in the root
# `Cargo.toml` (`[workspace.lints.clippy]`); this file holds the options those lints read.

# Tests may use the shortcuts that production code may not.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

# Every crate is internal (`publish = false`), so lints about public signatures can apply fully.
avoid-breaking-exported-api = false

# Names that are not code and need no backticks in documentation (`..` keeps clippy's defaults).
doc-valid-idents = [
  "cTrader",
  "OANDA",
  "FTMO",
  "TradingView",
  "MetaTrader",
  "OHLC",
  "WebSocket",
  "WebSockets",
  "..",
]

# `use gpui::*` is the idiom of the framework.
allowed-wildcard-imports = ["gpui", "gpui_kit"]

# A wall-clock read must go through the injectable clock, so that replay and backtests are
# deterministic. The one place that implements the clock opts out with
# `#[expect(clippy::disallowed_methods, reason = "...")]`.
disallowed-methods = [
  { path = "std::time::SystemTime::now", reason = "read the injected clock instead (replay, backtests)" },
  { path = "chrono::Utc::now", reason = "read the injected clock instead (replay, backtests)" },
  { path = "chrono::Local::now", reason = "read the injected clock instead (replay, backtests)" },
  { path = "std::thread::sleep", reason = "blocks the UI thread or the async executor" },
  { path = "reqwest::ClientBuilder::danger_accept_invalid_certs", reason = "never disable TLS certificate verification" },
  { path = "reqwest::ClientBuilder::danger_accept_invalid_hostnames", reason = "never disable TLS hostname verification" },
]

# A standard-library guard held across an `.await` can freeze the whole runtime.
await-holding-invalid-types = [
  "std::sync::MutexGuard",
  "std::sync::RwLockReadGuard",
  "std::sync::RwLockWriteGuard",
]
