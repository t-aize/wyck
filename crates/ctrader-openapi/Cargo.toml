[package]
name = "ctrader-openapi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "Rust client for the cTrader Open API over its JSON WebSocket: application and account sign in (OAuth loopback), live ticks, tick and bar history, with request matching, heartbeat and rate limits."

[dependencies]
async-trait = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util"] }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
secrecy = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "test-util", "net", "io-util"] }
