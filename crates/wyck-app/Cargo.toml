[package]
name = "wyck-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "The wyck application: the layer between wyck-engine and a front end (settings, startup, use cases, formatting, messages, hotkeys, logging, crash detection), a GPUI shell that `cargo run` launches."
default-run = "wyck-app"

[features]
default = ["gui"]
# The GPUI shell and the `wyck-app` binary. Without it the crate is the application layer
# alone, with no windowing toolkit in the build.
gui = ["dep:gpui-kit", "dep:async-channel"]

[[bin]]
name = "wyck-app"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
wyck-engine = { workspace = true }
wyck-config = { workspace = true }
global-hotkey = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
secrecy = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
gpui-kit = { workspace = true, optional = true }
async-channel = { workspace = true, optional = true }

[dev-dependencies]
wyck-engine = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
