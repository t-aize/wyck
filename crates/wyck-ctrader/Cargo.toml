[package]
name = "wyck-ctrader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "Client of the cTrader Open API: messages, connection, session, OAuth sign-in and the calls for market data, accounts and trading."

[dependencies]
async-trait.workspace = true
futures-util = { workspace = true, features = ["sink", "std"] }
reqwest = { workspace = true, features = ["native-tls"] }
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-tungstenite = { workspace = true, features = ["native-tls"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }
wyck-core.workspace = true
wyck-market.workspace = true
wyck-trading.workspace = true

[dev-dependencies]
dotenvy.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
