[package]
name = "wyck-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "Headless trading core for wyck: broker sessions, state snapshots, risk-based order planning, and a dry-run-first order pipeline."

[features]
# Exposes `broker::MockBroker`, a scriptable in-memory broker, for tests of code built on
# the engine (a GUI, for instance). Not needed in production builds.
testing = []

[dependencies]
ctrader-mcp = { workspace = true }
ctrader-openapi = { workspace = true }
wyck-config = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
secrecy = { workspace = true }
wyck-engine = { path = ".", features = ["testing"] }
ctrader-mcp = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
proptest = { workspace = true }
tempfile = { workspace = true }
rmcp = { workspace = true }

[[example]]
name = "dry_run_order"
required-features = ["testing"]

[[example]]
name = "headless"
