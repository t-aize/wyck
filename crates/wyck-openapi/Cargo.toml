[package]
name = "wyck-openapi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "cTrader Open API client, messages and trading calculations."

[features]
default = ["client"]
# The WebSocket client, the reconnecting session and OAuth. Without it the crate is only the
# messages, market types and calculations, with no network or async runtime.
client = [
    "dep:async-trait",
    "dep:futures-util",
    "dep:reqwest",
    "dep:secrecy",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:uuid",
]

[dependencies]
chrono.workspace = true
chrono-tz.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
dotenvy.workspace = true
tracing-subscriber.workspace = true
proptest.workspace = true

[[example]]
name = "accounts"
required-features = ["client"]

[[example]]
name = "prices"
required-features = ["client"]

[[example]]
name = "history"
required-features = ["client"]

[[example]]
name = "demo_order"
required-features = ["client"]

[lints]
workspace = true
