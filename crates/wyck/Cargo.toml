[package]
name = "wyck"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
keywords = ["ctrader", "trading", "forex", "gpui", "openapi"]
categories = ["finance", "gui"]
description = "Desktop trading terminal for cTrader."
default-run = "wyck"

[lib]
name = "wyck"
path = "src/lib.rs"

[[bin]]
name = "wyck"
path = "src/main.rs"
doc = false

[package.metadata.packager]
product-name = "Wyck"
identifier = "sh.wyck.wyck"
category = "finance"
description = "Desktop trading terminal for cTrader."
long-description = "Wyck is a native desktop trading terminal for cTrader."
homepage = "https://github.com/t-aize/wyck"
license-file = "../../LICENSE"
icons = ["assets/app-icon.png", "assets/app-icon.ico", "assets/app-icon.icns"]
out-dir = "dist"
formats = ["default"]
binaries = [{ path = "wyck", main = true }]

[package.metadata.packager.nsis]
installer-mode = "currentUser"
languages = ["English"]

[package.metadata.packager.windows]
allow-downgrades = false

[package.metadata.packager.linux]
generate-desktop-entry = true

[package.metadata.packager.deb]
depends = [
  "libasound2 | libasound2t64",
  "libc6",
  "libfontconfig1",
  "libssl3 | libssl3t64",
  "libwayland-client0",
  "libxcb1",
  "libxkbcommon0",
  "libxkbcommon-x11-0",
]

[dependencies]
ab_glyph.workspace = true
anyhow.workspace = true
chrono.workspace = true
gpui.workspace = true
gpui-kit.workspace = true
lsp-types.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tiny-skia.workspace = true
toml.workspace = true
tracing.workspace = true
wyck-app.workspace = true
wyck-chart.workspace = true
wyck-core.workspace = true
wyck-drawings.workspace = true
wyck-indicators.workspace = true
wyck-market.workspace = true
wyck-platform.workspace = true
wyck-storage.workspace = true
wyck-trading.workspace = true
wyck-ui-kit.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

# The code that is not in a crate of its own yet keeps this short list. A crate taken out of this
# one follows the full `[workspace.lints]` instead.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
