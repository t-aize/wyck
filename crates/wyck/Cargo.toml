[package]
name = "wyck"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
keywords = ["ctrader", "trading", "forex", "gpui", "openapi"]
categories = ["finance", "gui"]
description = "Desktop trading terminal for cTrader."
default-run = "wyck"

[[bin]]
name = "wyck"
path = "src/main.rs"
doc = false

[package.metadata.packager]
product-name = "Wyck"
identifier = "sh.wyck.wyck"
category = "finance"
description = "Desktop trading terminal for cTrader."
long-description = "Wyck is a native desktop trading terminal for cTrader."
homepage = "https://github.com/t-aize/wyck"
license-file = "../../LICENSE"
icons = ["assets/app-icon.png", "assets/app-icon.ico", "assets/app-icon.icns"]
out-dir = "dist"
formats = ["default"]
binaries = [{ path = "wyck", main = true }]

[package.metadata.packager.nsis]
installer-mode = "currentUser"
languages = ["English"]

[package.metadata.packager.windows]
allow-downgrades = false

[package.metadata.packager.linux]
generate-desktop-entry = true

[package.metadata.packager.deb]
depends = [
  "libasound2 | libasound2t64",
  "libc6",
  "libfontconfig1",
  "libssl3 | libssl3t64",
  "libwayland-client0",
  "libxcb1",
  "libxkbcommon0",
  "libxkbcommon-x11-0",
]

[dependencies]
chrono.workspace = true
gpui.workspace = true
tracing.workspace = true
wyck-app.workspace = true
wyck-clock.workspace = true
wyck-core.workspace = true
wyck-storage.workspace = true
wyck-ui.workspace = true


[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[lints]
workspace = true
