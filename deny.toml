# cargo-deny configuration. Run with `cargo deny check`.
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Known vulnerabilities and yanked crates fail the check.
yanked = "deny"
# Unmaintained notices are only enforced for direct dependencies. The ones in the graph today
# (instant, paste, rustls-pemfile, rustybuzz, ttf-parser) are pulled in by gpui and cannot be
# swapped from here.
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.9
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  "bzip2-1.0.6",
]

[bans]
# Several graphics and windowing crates pull in two majors of the same crate; that is not
# something this project can fix, so it is reported and not denied.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
