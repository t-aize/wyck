# cargo-deny configuration. Run with `cargo deny check`.
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Known vulnerabilities and yanked crates fail the check.
yanked = "deny"
# Unmaintained notices are only enforced for direct dependencies.
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSL-1.0",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
# Two majors of the same crate can come from dependencies this project does not control, so it
# is reported and not denied.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
